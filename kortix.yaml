# yaml-language-server: $schema=https://kortix.com/schema/kortix.schema.json
# Kortix: the agents that work on this repository, and what starts them.
# Reference: https://kortix.com/docs/developers#kortixyaml-reference

project:
  name: "marketing-factory"
  description: The Kortix Marketing Factory, as a reference to read and adapt.

# Secrets the marketing factory needs. `kortix onboard` and `kortix doctor --loops` read this list.
env:
  required: [GH_TOKEN, MARKETING_GITHUB_WEBHOOK_SECRET]

builtin_agents:
  my_kortix: true

default_agent: mykortix
imports:
  - .kortix/marketing/
